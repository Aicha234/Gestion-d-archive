<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Consultation : {{ doc_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f6f9; margin: 20px 40px; }
        .main-wrapper { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .document-reader {
            background-color: #ffffff;
            padding: 60px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            min-height: 75vh;
            border: 1px solid #e0e0e0;
            color: #333;
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap; 
            overflow-y: auto;
        }

        table {
    border-collapse: collapse;
    width: 100%;
    margin: 20px 0;
}
    table, th, td {
        border: 1px solid black; 
        padding: 8px;
        text-align: right;
    }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="mb-3">
        <a href="{% url 'search_page' %}" class="btn btn-outline-secondary btn-sm">
            <i class="fa-solid fa-arrow-left me-2"></i>Retour
        </a>
    </div>
    
    <div class="header">
        <h2>📄 {{ doc_name }} <span class="badge bg-primary ms-2 fs-6 text-uppercase">{{ file_type }}</span></h2>
        <button class="btn btn-success text-white fw-bold btn-sm px-3" id="btnCopyContent" onclick="copyToClipboard()">
            <i class="fa-regular fa-copy me-1"></i> Copier le contenu
        </button>
    </div>

    <div class="row m-0">
        <div id="contentDisplay" class="document-reader">
            {{ full_text }}
        </div>
    </div>
</div>

<textarea id="hiddenDocumentText" style="display: none;">{{ full_text }}</textarea>

<script>
    let currentMatchIndex = 0;
    let matches = [];

    window.addEventListener('DOMContentLoaded', () => {
        let keyword = "{{ search_keyword|escapejs }}";
        if (!keyword) {
            keyword = sessionStorage.getItem('last_search_query') || '';
        }

        if (keyword && keyword.trim() !== "") {
            const contentDisplay = document.getElementById('contentDisplay');
            
            // 1. Standard Highlight Color (The Word "Ctrl+F" yellow)
            const regex = new RegExp(`(${keyword})`, 'gi');
            contentDisplay.innerHTML = contentDisplay.innerHTML.replace(
                regex, 
                '<mark class="search-match" style="background-color: #ffff00; color: #000; padding: 0 2px; border-radius: 2px;">$1</mark>'
            );

            matches = document.querySelectorAll('.search-match');
            
            if (matches.length > 0) {
                scrollToMatch(0);
            }
        }
    });

    function scrollToMatch(index) {
        if (matches[index]) {
            matches[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Reset all to standard highlight yellow (#ffff00)
            matches.forEach(m => {
                m.style.backgroundColor = '#ffff00';
                m.style.color = '#000';
            });
            
            // Set active word to the "Selected" yellow (#ffc107)
            matches[index].style.backgroundColor = '#ffc107';
            matches[index].style.color = '#000'; // Keep text black for best readability
            
            currentMatchIndex = index;
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (matches.length > 0) {
                currentMatchIndex = (currentMatchIndex + 1) % matches.length;
                scrollToMatch(currentMatchIndex);
            }
        }
    });


    function copyToClipboard() {
    const contentDisplay = document.getElementById('contentDisplay');
    const textToCopy = contentDisplay.innerText;
    navigator.clipboard.writeText(textToCopy).then(() => {
        alert("Le texte a été copié dans le presse-papier !");
    }).catch(err => {
        console.error('Échec de la copie : ', err);
    });
}
</script>
</body>
</html>
